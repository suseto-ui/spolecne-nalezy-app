    <!-- Central Aperture / Lens -->
    <circle cx="0" cy="21.504" r="68.8128" fill="#0B0E14" stroke="url(#primaryGrad)" stroke-width="17.92"/>
    <circle cx="0" cy="21.504" r="34.4064" fill="#00F2FE"/>

    <!-- Sparkle / AI Star top right -->
    <path d="M 94.6176 -94.6176 
